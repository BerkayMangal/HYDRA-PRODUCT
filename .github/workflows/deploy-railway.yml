name: Production deployment moved
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical_repository:
    runs-on: ubuntu-latest
    steps:
      - name: Point to the actual production source
        run: |
          echo '::notice::Production deploys from BerkayMangal/hydra-trading-bot main. HYDRA-PRODUCT is the historical research archive; no deployment is performed here.'
          echo 'Production source: https://github.com/BerkayMangal/hydra-trading-bot' >> "$GITHUB_STEP_SUMMARY"
          echo 'Live application: https://web-production-57fc0.up.railway.app/' >> "$GITHUB_STEP_SUMMARY"
